[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-editor"
version = "0.1.0"
description = "Local-first automated retention video editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]
audio-nn = [
    "torch",
    "beat-this",
    "einops",
    "soxr",
    "rotary-embedding-torch",
]

[project.scripts]
viral-editor = "viral_editor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
